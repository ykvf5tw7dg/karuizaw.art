services:
  web:
    build: .
    image: karuizawa-art:local
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:12002:3000"
    volumes:
      - ./data:/app/data
    mem_limit: 1536m
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
